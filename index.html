<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoes Design</title>
    <!-- font awesome link start -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- font awesome link end -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <section id="add-to-cart">
            <div class="card">
                <div class="header">
                    <div class="logo">
                        <img src="./images/Adidas_logo.png" alt="">
                    </div>
                    <div class="icon">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </div>
                </div>
                <div class="img">
                    <img src="./images/shoes.png" alt="">
                </div>
                <div class="card-info">
                    <div class="info-text">
                        <h3>ADIDAS GAZE ZX</h3>
                    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ullam cum voluptate nobis doloribus.</p>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-regular fa-star"></i>
                    </div>
                </div>
                <div class="clrp">
                     <span>Colour:</span>
                    <input type="radio" name="color" checked/>
                    <input type="radio" name="color" />
                    <input type="radio" name="color" />
                </div>
                <div class="price">
                    <h4>$09.00</h4>
                    <p>Nine Dollar Only</p>
                </div>
                <div class="button">
                    <button>
                        <a href="">Add To Cart</a>
                    </button>
                </div>
            </div>
                
    </section>
  </body>
</html>
